name: Forge Config API Port

# The Configuration Files element generates native configuration code for Forge 1.16.5 to 1.20.1 and for NeoForge
# 1.20.1 to 1.21.8. Only Fabric still uses the Forge Config API Port implementation below.
#
# Fabric 1.21.8 uses the remapping Fabric Loom, where a mod dependency is declared with modImplementation. Loom neither
# exposes the Night Config jar-in-jar of the port to the compile classpath nor loads it into the development run
# classpath, while the port configuration API extends types of that library. The Night Config core and toml artifacts
# are therefore declared as regular dependencies. They are not packaged into the mod jar; an installed mod receives
# them from the port itself.
#
# The NeoForge and Forge implementations are compatibility markers only. Both platforms have the configuration API
# built in, so these entries must not add a Gradle dependency or generated code. They exist so a workspace that has the
# port API enabled can switch from Fabric to a Forge or NeoForge generator without MCreator reporting a missing API.
# The empty gradle string is intentional: the Gradle integration appends this value to mcreator.gradle, and an omitted
# value would be written as the literal null. If the compatibility marker remains enabled after conversion, the
# generated mod metadata may contain an optional forgeconfigapiport entry. It does not make the port a required
# dependency and does not change the build.
#
# NeoForge 1.20.4, 1.20.6, 1.21.1, 1.21.4 and 1.21.8 use the native net.neoforged.neoforge.common.ModConfigSpec. The
# NeoForge 1.20.1 generator is a copy of the legacy Forge 1.20.1 generator and uses ForgeConfigSpec.

neoforge-1.20.1:
  required_when_enabled: false
  version_range: "[0,)"
  gradle: ""

neoforge-1.20.4:
  required_when_enabled: false
  version_range: "[0,)"
  gradle: ""

neoforge-1.20.6:
  required_when_enabled: false
  version_range: "[0,)"
  gradle: ""

neoforge-1.21.1:
  required_when_enabled: false
  version_range: "[0,)"
  gradle: ""

neoforge-1.21.4:
  required_when_enabled: false
  version_range: "[0,)"
  gradle: ""

neoforge-1.21.8:
  required_when_enabled: false
  version_range: "[0,)"
  gradle: ""

fabric-1.21.8:
  required_when_enabled: true
  version_range: ">=21.8.2"
  gradle: |
    repositories {
        mavenCentral()
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
        }
    }

    dependencies {
        modImplementation 'maven.modrinth:forge-config-api-port:v21.8.2-1.21.8-Fabric'
        implementation 'com.electronwill.night-config:core:3.8.3'
        implementation 'com.electronwill.night-config:toml:3.8.3'
    }

forge-1.16.5:
  required_when_enabled: false
  version_range: "[0,)"
  gradle: ""

