name: Forge Config API Port

# The Configuration Files element generates native Forge configuration code on Forge 1.16.5 to 1.20.1 and code against
# Forge Config API Port on NeoForge and Fabric. The port implementations below add the compile time dependency and the
# runtime dependency of the port to the workspace. The mod id of the API definition (and therefore the id used in the
# generated mod metadata) is the mod id of the port itself.
#
# Fabric 1.21.8 uses the remapping Fabric Loom, where a mod dependency is declared with modImplementation. Loom neither
# exposes the Night Config jar-in-jar of the port to the compile classpath nor loads it into the development run
# classpath, while ForgeConfigSpec extends types of that library. The Night Config core and toml artifacts are therefore
# declared as regular dependencies. They are not packaged into the mod jar; an installed mod receives them from the port
# itself.
#
# NeoForge 1.20.4, 1.20.6, 1.21.1, 1.21.4 and 1.21.8 use Mojang mappings and do not remap mod dependencies, so the
# NeoForge publication of the port is a regular implementation dependency there. NeoForge and FancyModLoader already
# supply Night Config on the compile and development run classpath, so no additional Night Config artifacts are declared
# for those generators. The version ranges are Maven ranges, because the NeoForge mod metadata generator consumes them
# verbatim.
#
# The Forge 1.16.5 to 1.20.1 implementations are compatibility markers only. Forge has the configuration API built in,
# so these entries must not add a Gradle dependency or generated code. They exist so a workspace that has the port API
# enabled can switch from a NeoForge or Fabric generator to a Forge generator without MCreator reporting a missing API.
# The empty gradle string is intentional: the Gradle integration appends this value to mcreator.gradle, and an omitted
# value would be written as the literal null. If the compatibility marker remains enabled after conversion, the Forge
# metadata may contain an optional forgeconfigapiport entry. It does not make the port a required Forge dependency and
# does not change the Forge build.

neoforge-1.20.4:
  required_when_enabled: true
  version_range: "[20.4.3,)"
  gradle: |
    repositories {
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
        }
    }

    dependencies {
        implementation 'maven.modrinth:forge-config-api-port:v20.4.3-1.20.4-NeoForge'
    }

