# NeoForge. The 1.20.1 generator uses the Forge compatible native configuration API.
neoforge-1.20.1:
  required_when_enabled: false
  version_range: "[0,)"
  gradle: ""

neoforge-1.20.4:
  required_when_enabled: true
  version_range: "[20.4.3,)"
  gradle: |
    repositories {
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
        }
    }

    dependencies {
        implementation 'maven.modrinth:forge-config-api-port:v20.4.3-1.20.4-NeoForge'
    }

