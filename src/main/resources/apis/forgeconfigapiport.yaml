fabric-1.21.8:
  required_when_enabled: true
  version_range: ">=21.8.2"
  gradle: |
    repositories {
        mavenCentral()
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
        }
    }

    dependencies {
        modImplementation 'maven.modrinth:forge-config-api-port:v21.8.2-1.21.8-Fabric'
        implementation 'com.electronwill.night-config:core:3.8.3'
        implementation 'com.electronwill.night-config:toml:3.8.3'
    }

