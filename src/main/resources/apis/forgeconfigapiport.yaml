name: Forge Config API Port

# Forge and NeoForge have a native configuration API, so the plugin never adds an external API dependency for those
# loaders. The entries below are compatibility shells: a workspace that still has this API enabled from an older
# plugin release can switch between supported generators without MCreator reporting a missing API.
#
# Fabric uses Forge Config API Port because it has no native Forge style configuration system. The plugin injects the
# port and its Night Config compile dependencies into a managed block of the generated build.gradle on every build
# instead of adding them through this external API definition. That keeps the workspace external API list clean and
# avoids writing an implementation dependency into the generated mod metadata.
#
# The empty gradle string is intentional: the Gradle integration appends this value to mcreator.gradle, and an omitted
# value would be written as the literal null. The version ranges are Maven ranges because the generated mod metadata
# consumes them verbatim.

forge-1.12.2:

  required_when_enabled: false
  version_range: "[0,)"
  gradle: ""

